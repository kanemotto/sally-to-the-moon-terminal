name: Refresh US market data and publish Sally To The Moon

on:
  push:
    branches: [main]
    paths-ignore:
      - "dist/scan.json"
      - "dist/stocks.json"
  workflow_dispatch:
  schedule:
    # Every hour during the regular US session. GitHub cron uses UTC.
    # These windows cover both daylight-saving and standard time; the script is harmless outside market hours.
    - cron: "35 13-21 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh delayed market scan during US market hours
        if: github.event_name == 'schedule'
        run: python3 update_scan.py --market-hours-only
      - name: Refresh delayed market scan for manual or published updates
        if: github.event_name != 'schedule'
        run: python3 update_scan.py
      - name: Save refreshed market data
        run: |
          if git diff --quiet -- dist/scan.json dist/stocks.json; then
            echo "No market data changes to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/scan.json dist/stocks.json
          git commit -m "Refresh US market data [skip ci]"
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
